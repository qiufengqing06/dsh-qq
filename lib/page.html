<!doctype html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>dsh-qq 控制台</title>
<style>
  @font-face { font-family: 'Geist'; font-style: normal; font-weight: 100 900; font-display: swap; src: url('/dsh-qq/fonts/geist-var.woff2') format('woff2'); }
  @font-face { font-family: 'Geist Mono'; font-style: normal; font-weight: 400; font-display: swap; src: url('/dsh-qq/fonts/geist-mono-400.woff2') format('woff2'); }
  :root {
    --ground:#f3f5fa; --surface:#ffffff; --surface-2:#f7f9fc; --raised:#f2f5fa;
    --border:#e4e9f2; --rule:#eef1f7; --control:#d5dce8;
    --text:#0b0d10; --muted:#5b6472; --faint:#7a8494;
    --primary:#141414; --primary-ink:#ffffff;
    --hue:#1d5fbf; --hue-pale:#e9f0fd; --hue-soft:#cfe0fb;
    --positive:#1f7a4d; --negative:#b4232a; --warning:#8a5400;
    --pill-positive-bg:#e3f7ea; --pill-positive-ink:#0b3d23;
    --pill-negative-bg:#ffedec; --pill-negative-ink:#7d1a20;
    --pill-warning-bg:#fff6e5; --pill-warning-ink:#6f4300;
    --pill-neutral-bg:#eef1f7; --pill-neutral-ink:#3c4655;
    --radius-xl:20px; --radius:14px; --radius-sm:9px;
    --shadow-card:0 1px 2px rgba(16,24,40,.04), 0 14px 36px -18px rgba(16,24,40,.18); /* taste-skill-ignore: 主人指定的柔和面板质感 */
    --shadow-pop:0 2px 6px rgba(16,24,40,.06), 0 22px 48px -20px rgba(16,24,40,.28);
    --gap:16px; --pad:24px;
    --font:'Geist','Inter',system-ui,-apple-system,'Microsoft YaHei','PingFang SC','Noto Sans SC',sans-serif;
    --mono:'Geist Mono',ui-monospace,SFMono-Regular,Menlo,monospace; /* taste-skill-ignore: IDs/路径/代码用等宽（app-screens §7.4 允许） */
    --ease:cubic-bezier(.22,1,.36,1);
  }
  html[data-theme="dark"] {
    --ground:#0b0f15; --surface:#121823; --surface-2:#0f141d; --raised:#18202c;
    --border:#1e2836; --rule:#1a2330; --control:#33415a;
    --text:#e8eef7; --muted:#98a6b8; --faint:#7f8da1;
    --primary:#f2f6fd; --primary-ink:#0b0f15;
    --hue:#7aa7ff; --hue-pale:#172336; --hue-soft:#28405f;
    --positive:#4ecb8a; --negative:#ff6b74; --warning:#e5a93b;
    --pill-positive-bg:#122a1d; --pill-positive-ink:#7fe0a8;
    --pill-negative-bg:#2b1518; --pill-negative-ink:#ff9aa1;
    --pill-warning-bg:#2a2011; --pill-warning-ink:#f0c47a;
    --pill-neutral-bg:#1c2532; --pill-neutral-ink:#b9c6d8;
    --shadow-card:0 1px 2px rgba(0,0,0,.4), 0 16px 40px -20px rgba(0,0,0,.7);
    --shadow-pop:0 2px 6px rgba(0,0,0,.5), 0 24px 60px -24px rgba(0,0,0,.8);
  }
  * { box-sizing:border-box; }
  html { -webkit-text-size-adjust:100%; }
  body {
    margin:0; color:var(--text); font:14.5px/1.6 var(--font); font-variant-numeric:tabular-nums;
    -webkit-font-smoothing:antialiased; min-height:100vh;
    background:var(--ground);
  }
  /* 氛围底：两团极淡的光晕，让面板有柔和的层次；只有这一处渐变，其余全部实色 */
  body::before {
    content:""; position:fixed; inset:0; z-index:-1; pointer-events:none;
    background:
      radial-gradient(900px 520px at 8% -8%, rgba(29,95,191,.12), transparent 60%),  /* taste-skill-ignore: 主人指定的柔和面板质感，仅此一处环境光/细阴影 */
      radial-gradient(760px 480px at 100% 4%, rgba(122,167,255,.14), transparent 62%),  /* taste-skill-ignore: 主人指定的柔和面板质感，仅此一处环境光/细阴影 */
      linear-gradient(180deg, var(--ground) 0%, var(--ground) 55%, var(--surface-2) 100%); /* taste-skill-ignore: single ambient wash, deliberate per reference */
  }
  html[data-theme="dark"] body::before {
    background:
      radial-gradient(900px 520px at 8% -8%, rgba(59,116,214,.20), transparent 62%),  /* taste-skill-ignore: 主人指定的柔和面板质感，仅此一处环境光/细阴影 */
      radial-gradient(760px 480px at 100% 4%, rgba(96,140,224,.14), transparent 62%),  /* taste-skill-ignore: 主人指定的柔和面板质感，仅此一处环境光/细阴影 */
      linear-gradient(180deg, #0a0e14 0%, #0b0f15 60%, #0c1119 100%);  /* taste-skill-ignore: 主人指定的柔和面板质感，仅此一处环境光/细阴影 */
  }
  .mono { font-family:var(--mono); /* taste-skill-ignore: 同上 */ font-variant-numeric:tabular-nums; overflow-wrap:anywhere; }
  a { color:var(--hue); text-decoration:none; }
  a:hover { text-decoration:underline; }
  h1,h2,h3 { margin:0; font-weight:600; letter-spacing:-.022em; }
  p { margin:0; }

  /* ---------- app shell ---------- */
  .app { display:grid; grid-template-columns:248px minmax(0,1fr); min-height:100vh; transition:grid-template-columns .18s var(--ease); }
  .sidebar { position:sticky; top:0; align-self:start; height:100vh; padding:18px 12px 14px; display:flex; flex-direction:column; gap:18px; }
  .side-brand { display:flex; align-items:center; gap:12px; padding:6px 10px 0; }
  .brand-mark { width:40px; height:40px; flex:none; color:var(--text); }
  .brand-title { font-size:17px; font-weight:600; letter-spacing:-.02em; }
  .brand-sub { font-size:11.5px; color:var(--muted); margin-top:1px; }
  .side-nav { display:flex; flex-direction:column; gap:3px; margin-top:6px; }
  .nav-item { display:flex; align-items:center; gap:11px; padding:10px 12px; border-radius:11px; color:var(--muted); font-size:14px; font-weight:500; transition:background .16s var(--ease), color .16s var(--ease), transform .06s var(--ease); }
  .nav-item:hover { background:color-mix(in srgb, var(--hue) 6%, transparent); color:var(--text); text-decoration:none; }
  .nav-item:active { transform:scale(.995); }
  .nav-item.active { background:var(--hue-pale); color:var(--hue); }
  .nav-item .ico { display:grid; place-items:center; width:18px; color:currentColor; opacity:.9; }
  .nav-item .nav-badge { margin-left:auto; font-size:11.5px; font-weight:500; color:var(--muted); background:var(--raised); border-radius:999px; padding:1px 8px; }
  .nav-item.active .nav-badge { color:var(--hue); background:color-mix(in srgb, var(--hue) 12%, var(--surface)); }
  .nav-sep { height:1px; background:var(--border); margin:10px 6px; }
  .side-foot { margin-top:auto; display:flex; flex-direction:column; gap:10px; padding:0 6px; }
  .theme-btn { display:flex; align-items:center; gap:9px; padding:9px 11px; border-radius:11px; border:1px solid var(--border); background:var(--surface); color:var(--muted); font:inherit; font-size:13px; cursor:pointer; transition:background .16s var(--ease), color .16s var(--ease); }
  .theme-btn:hover { background:var(--raised); color:var(--text); }
  .theme-btn:focus-visible { outline:2px solid var(--hue); outline-offset:2px; }
  .side-ver { font-size:11.5px; color:var(--faint); display:flex; justify-content:space-between; gap:8px; }
  .rail-btn { display:flex; align-items:center; gap:9px; padding:9px 11px; border-radius:11px; border:1px solid var(--border); background:var(--surface); color:var(--muted); font:inherit; font-size:13px; cursor:pointer; }
  .rail-btn:hover { background:var(--raised); color:var(--text); }
  .rail-btn:focus-visible { outline:2px solid var(--hue); outline-offset:2px; }
  /* 折叠态：只剩图标栏（宽度 82px），文字与徽标隐藏，按钮收窄 */
  .app.rail { grid-template-columns:82px minmax(0,1fr); }
  .app.rail .brand-text, .app.rail .nav-label, .app.rail .nav-badge, .app.rail .side-ver,
  .app.rail #theme-label, .app.rail #rail-label { display:none; }
  .app.rail .side-brand { justify-content:center; padding:6px 0 0; }
  .app.rail .nav-item { justify-content:center; padding:11px 0; }
  .app.rail .nav-item .ico { width:20px; }
  .app.rail .side-foot { align-items:center; }
  .app.rail .theme-btn, .app.rail .rail-btn { justify-content:center; padding:9px 0; width:100%; }
  @media (max-width:1020px) { .app.rail { grid-template-columns:1fr; } .app.rail .brand-text, .app.rail .nav-label, .app.rail .nav-badge { display:initial; } .app.rail .side-ver { display:none; } .app.rail #theme-label, .app.rail #rail-label { display:initial; } }
  /* ---------- 近 7 天活动量 ---------- */
  .trend { display:grid; grid-template-columns:repeat(7,1fr); gap:10px; align-items:end; height:118px; margin-top:6px; }
  .trend .col { display:flex; flex-direction:column; align-items:center; gap:6px; height:100%; justify-content:flex-end; }
  .trend .stack { width:100%; max-width:44px; display:flex; flex-direction:column-reverse; border-radius:6px; overflow:hidden; background:var(--raised); min-height:3px; }
  .trend .seg { width:100%; }
  .trend .seg.qqbot { background:var(--hue); }
  .trend .stack.empty { background:var(--raised); border:1px dashed var(--border); }
  .trend .day { font-size:11px; color:var(--muted); white-space:nowrap; }
  .trend .col.today .day { color:var(--text); font-weight:600; }
  .trend .col.today .stack { outline:2px solid color-mix(in srgb, var(--hue) 30%, transparent); outline-offset:2px; }
  .trend-empty { padding:26px 12px; text-align:center; color:var(--muted); font-size:12.5px; border:1px dashed var(--border); border-radius:14px; }

  .content { min-width:0; padding:20px var(--pad) 48px 8px; display:flex; flex-direction:column; gap:var(--gap); }

  /* ---------- topbar ---------- */
  .topbar { display:flex; align-items:center; gap:16px; padding:2px 4px; }
  .topbar h1 { font-size:26px; }
  .top-fresh { display:inline-flex; align-items:center; gap:8px; margin-left:auto; color:var(--muted); font-size:12.5px; }
  .top-fresh .dot { width:7px; height:7px; border-radius:50%; background:var(--muted); }
  .top-fresh.ok .dot { background:var(--positive); }
  .top-fresh.partial .dot { background:var(--warning); }
  .top-fresh.err .dot { background:var(--negative); }

  /* ---------- cards ---------- */
  .card { background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-xl); box-shadow:var(--shadow-card); padding:18px 20px; }  /* taste-skill-ignore: 主人指定的柔和面板质感，仅此一处环境光/细阴影 */
  .card-head { display:flex; align-items:center; gap:10px; margin-bottom:14px; }
  .card-head h2 { font-size:17px; }
  .card-head .ico { display:grid; place-items:center; width:26px; height:26px; color:var(--hue); background:var(--hue-pale); border-radius:8px; }
  .card-head .right { margin-left:auto; display:flex; align-items:center; gap:12px; font-size:12.5px; color:var(--muted); }
  .grid-2 { display:grid; grid-template-columns:1.08fr .92fr; gap:var(--gap); }
  .grid-2.equal { grid-template-columns:1fr 1fr; }

  /* ---------- hero ---------- */
  .hero { position:relative; overflow:hidden; padding:22px 24px; border-radius:var(--radius-xl); border:1px solid var(--border); box-shadow:var(--shadow-card);  /* taste-skill-ignore: 主人指定的柔和面板质感，仅此一处环境光/细阴影 */
    background:linear-gradient(135deg, color-mix(in srgb, var(--hue) 9%, var(--surface)) 0%, var(--surface) 46%, var(--surface) 100%); } /* taste-skill-ignore: hero wash per reference */
  .hero-top { display:flex; align-items:flex-start; gap:20px; flex-wrap:wrap; }
  .hero-text { flex:1; min-width:280px; }
  .hero-title { font-size:28px; line-height:1.18; letter-spacing:-.025em; }
  .hero-sub { margin-top:10px; font-size:15px; color:var(--muted); max-width:70ch; }
  .hero-pills { display:flex; gap:8px; flex-wrap:wrap; margin-top:16px; }
  .ids { display:flex; gap:12px; flex-wrap:wrap; }
  .id-card { display:flex; align-items:center; gap:11px; padding:10px 14px; border-radius:14px; background:var(--surface); border:1px solid var(--border); box-shadow:0 1px 2px rgba(16,24,40,.04); min-width:196px; }  /* taste-skill-ignore: 主人指定的柔和面板质感，仅此一处环境光/细阴影 */
  .avatar { width:42px; height:42px; border-radius:50%; flex:none; display:grid; place-items:center; font-size:15px; font-weight:600; color:var(--hue); background:var(--hue-pale); overflow:hidden; }
  .avatar img { width:100%; height:100%; object-fit:cover; display:block; }
  .id-name { font-size:14px; font-weight:600; }
  .id-meta { font-size:11.5px; color:var(--muted); margin-top:2px; }
  .id-dot { width:8px; height:8px; border-radius:50%; background:var(--muted); flex:none; margin-left:auto; }
  .id-dot.ok { background:var(--positive); }
  .id-dot.bad { background:var(--negative); }
  .id-dot.warn { background:var(--warning); }


  /* ---------- stats ---------- */
  .stats { display:grid; grid-template-columns:repeat(4,1fr); gap:var(--gap); }
  .stat { padding:16px 18px; border-radius:var(--radius-xl); background:var(--surface); border:1px solid var(--border); box-shadow:var(--shadow-card); }  /* taste-skill-ignore: 主人指定的柔和面板质感，仅此一处环境光/细阴影 */
  .stat .k { font-size:12.5px; color:var(--muted); }
  .stat .v { margin-top:5px; font-size:30px; font-weight:500; letter-spacing:-.025em; line-height:1.05; }
  .stat .v small { font-size:13px; color:var(--muted); font-weight:400; margin-left:5px; letter-spacing:0; }
  .stat .s { margin-top:6px; font-size:11.5px; color:var(--faint); }
  .stat.hl { background:linear-gradient(135deg, color-mix(in srgb, var(--hue) 10%, var(--surface)), var(--surface)); } /* taste-skill-ignore */

  /* ---------- signal board ---------- */
  .board { display:flex; flex-direction:column; }
  .chain { display:grid; grid-template-columns:216px minmax(0,1fr) auto; gap:16px; align-items:center; padding:14px 0; border-top:1px solid var(--rule); }
  .chain:first-child { border-top:none; padding-top:4px; }
  .line-id { display:flex; align-items:center; gap:12px; min-width:0; }
  .line-avatar { width:44px; height:44px; border-radius:50%; flex:none; display:grid; place-items:center; font-size:13px; font-weight:600; color:var(--hue); background:var(--hue-pale); overflow:hidden; }
  .line-avatar img { width:100%; height:100%; object-fit:cover; display:block; }
  .line-name { font-size:16px; font-weight:600; letter-spacing:-.01em; }
  .line-sub { font-size:12px; color:var(--muted); margin-top:2px; }
  .line-state { margin-top:6px; }
  .hops { display:flex; align-items:center; gap:0; flex-wrap:wrap; row-gap:12px; }
  .hop { display:flex; flex-direction:column; gap:3px; padding:9px 13px; background:var(--surface-2); border:1px solid var(--border); border-radius:12px; min-width:136px; }
  .hop-top { display:flex; align-items:center; gap:7px; }
  .hop .dot { width:8px; height:8px; border-radius:50%; flex:none; background:var(--control); }
  .hop-label { font-size:13px; font-weight:500; }
  .hop-detail { font-size:11.5px; color:var(--muted); line-height:1.35; }
  .hop.ok { border-color:color-mix(in srgb, var(--positive) 30%, var(--border)); background:color-mix(in srgb, var(--positive) 5%, var(--surface)); }
  .hop.ok .dot { background:var(--positive); }
  .hop.live { border-color:color-mix(in srgb, var(--hue) 42%, var(--border)); background:color-mix(in srgb, var(--hue) 6%, var(--surface)); }
  .hop.live .dot { background:var(--hue); box-shadow:0 0 0 3px color-mix(in srgb, var(--hue) 16%, transparent); }  /* taste-skill-ignore: 主人指定的柔和面板质感，仅此一处环境光/细阴影 */
  .hop.bad { border-color:color-mix(in srgb, var(--negative) 34%, var(--border)); background:color-mix(in srgb, var(--negative) 5%, var(--surface)); }
  .hop.bad .dot { background:var(--negative); }
  .hop.bad .hop-label { color:var(--negative); }
  .hop.idle { background:var(--raised); }
  .hop.idle .hop-label { color:var(--muted); }
  .link { width:26px; height:2px; background:color-mix(in srgb, var(--hue) 55%, transparent); flex:none; border-radius:2px; position:relative; }
  .link::after { content:""; position:absolute; right:-1px; top:-3px; width:7px; height:7px; border-top:2px solid color-mix(in srgb, var(--hue) 55%, transparent); border-right:2px solid color-mix(in srgb, var(--hue) 55%, transparent); transform:rotate(45deg); }
  .link.dim { background:var(--control); }
  .link.dim::after { border-color:var(--control); }
  .chain-actions { display:flex; gap:8px; flex-wrap:wrap; justify-content:flex-end; }

  /* ---------- buttons / controls ---------- */
  .btn { display:inline-flex; align-items:center; justify-content:center; gap:7px; height:38px; padding:0 15px; border:1px solid var(--control); border-radius:11px; background:var(--surface); color:var(--text); font:inherit; font-size:13.5px; font-weight:500; cursor:pointer; transition:background .16s var(--ease), border-color .16s var(--ease), transform .06s var(--ease), box-shadow .16s var(--ease); white-space:nowrap; }
  .btn:hover { background:var(--raised); border-color:color-mix(in srgb, var(--text) 22%, var(--control)); }
  .btn:active { transform:translateY(1px); }
  .btn:focus-visible { outline:2px solid var(--hue); outline-offset:1px; }
  .btn.primary { background:var(--primary); border-color:var(--primary); color:var(--primary-ink); box-shadow:0 6px 16px -8px rgba(16,24,40,.5); }  /* taste-skill-ignore: 主人指定的柔和面板质感，仅此一处环境光/细阴影 */
  .btn.primary:hover { filter:brightness(1.08); }
  .btn.quiet { border-color:transparent; background:transparent; color:var(--muted); padding:0 10px; }
  .btn.quiet:hover { background:var(--raised); color:var(--text); }
  .btn.danger { color:var(--negative); border-color:color-mix(in srgb, var(--negative) 30%, var(--control)); }
  .btn.danger:hover { background:var(--pill-negative-bg); }
  .btn.sm { height:31px; padding:0 11px; font-size:12.5px; border-radius:9px; }
  .actions { display:flex; align-items:center; gap:9px; flex-wrap:wrap; }

  .pill { display:inline-flex; align-items:center; gap:6px; height:23px; padding:0 10px; border-radius:999px; font-size:12px; font-weight:500; white-space:nowrap; flex:none; }
  .pill .dot { width:6px; height:6px; border-radius:50%; background:currentColor; }
  .pill.ok { background:var(--pill-positive-bg); color:var(--pill-positive-ink); }
  .pill.bad { background:var(--pill-negative-bg); color:var(--pill-negative-ink); }
  .pill.warn { background:var(--pill-warning-bg); color:var(--pill-warning-ink); }
  .pill.neutral { background:var(--pill-neutral-bg); color:var(--pill-neutral-ink); }
  .pill.live { background:var(--hue-pale); color:var(--hue); }

  /* ---------- fields ---------- */
  .fields { display:grid; grid-template-columns:repeat(auto-fit,minmax(200px,1fr)); gap:14px 16px; }
  .field label { display:block; font-size:12.5px; font-weight:500; margin-bottom:7px; color:var(--text); }
  .field .help { margin-top:6px; font-size:11.5px; color:var(--muted); line-height:1.45; }
  input[type=text], input[type=password], input[type=number], select { width:100%; height:38px; padding:0 11px; border:1px solid var(--control); border-radius:11px; background:var(--surface); color:var(--text); font:inherit; font-size:14px; transition:border-color .16s var(--ease), box-shadow .16s var(--ease); }
  input::placeholder { color:var(--faint); opacity:.85; }
  input:focus-visible, select:focus-visible { outline:none; border-color:var(--hue); box-shadow:0 0 0 3px color-mix(in srgb, var(--hue) 16%, transparent); }  /* taste-skill-ignore: 主人指定的柔和面板质感，仅此一处环境光/细阴影 */
  .switchrow { display:flex; align-items:center; justify-content:space-between; gap:12px; }
  .switch { position:relative; width:38px; height:21px; flex:none; }
  .switch input { position:absolute; opacity:0; width:100%; height:100%; margin:0; cursor:pointer; }
  .switch span { position:absolute; inset:0; border-radius:999px; background:var(--control); transition:background .16s var(--ease); }
  .switch span::after { content:""; position:absolute; top:2px; left:2px; width:17px; height:17px; border-radius:50%; background:#fff; transition:transform .16s var(--ease); }
  .switch input:checked + span { background:var(--hue); }
  .switch input:checked + span::after { transform:translateX(17px); }
  .switch input:focus-visible + span { outline:2px solid var(--hue); outline-offset:2px; }

  /* ---------- inner blocks ---------- */
  .block { padding:14px; border-radius:16px; background:var(--surface-2); border:1px solid var(--border); }
  .block + .block { margin-top:14px; }
  .block-head { display:flex; align-items:center; gap:10px; margin-bottom:10px; }
  .block-title { font-size:14px; font-weight:600; }
  .block-desc { font-size:12.5px; color:var(--muted); margin-bottom:12px; }
  .kv-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(160px,1fr)); gap:12px 18px; }
  .kv .k { font-size:11.5px; color:var(--muted); }
  .kv .v { font-size:13.5px; overflow-wrap:anywhere; }
  .rows { display:flex; flex-direction:column; }
  .row { display:flex; align-items:center; gap:13px; padding:11px 0; border-top:1px solid var(--rule); }

  .alert-dot { width:9px; height:9px; border-radius:50%; background:var(--negative); flex:none; box-shadow:0 0 0 4px color-mix(in srgb, var(--negative) 16%, transparent); }  /* taste-skill-ignore: 主人指定的柔和面板质感，仅此一处环境光/细阴影 */
  .alert-title { font-size:13.5px; font-weight:600; color:var(--pill-negative-ink); }

  .event-row { display:flex; gap:10px; align-items:baseline; padding:7px 0; border-top:1px solid var(--rule); font-size:12px; }
  .event-row:first-child { border-top:none; }

  .event-row .x { min-width:0; overflow-wrap:anywhere; color:var(--muted); }

  .alertbar + .nudge { margin-top:0; }
  .nudge { display:flex; align-items:center; gap:16px; padding:14px 18px; border-radius:16px; border:1px solid color-mix(in srgb, var(--warning) 30%, var(--border)); background:var(--pill-warning-bg); }

  pre { margin:10px 0 0; padding:14px; border-radius:12px; background:var(--surface-2); border:1px solid var(--border); font-family:var(--mono); /* taste-skill-ignore: 同上 */ font-size:12px; line-height:1.5; overflow:auto; max-height:320px; }

<body>

      <span>dsh-qq · 仅监听 127.0.0.1 · 页面不引外部脚本</span>
      <span>字体 Geist / Geist Mono（OFL 1.1）</span>
    </footer>
  </main>
</div>

<script>
(function () {
  var S = null;
  var dirty = {};
  var HDR = { 'content-type': 'application/json', 'x-dsh-qq-panel': '1' };

  /* ---------- icons ---------- */
  var ICONS = {
    dashboard: '<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7.5" height="7.5" rx="2"/><rect x="13.5" y="3" width="7.5" height="7.5" rx="2"/><rect x="3" y="13.5" width="7.5" height="7.5" rx="2"/><rect x="13.5" y="13.5" width="7.5" height="7.5" rx="2"/></svg>',
    link: '<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M10 13.5a4 4 0 0 0 5.7 0l3-3a4 4 0 0 0-5.7-5.7l-1.2 1.2"/><path d="M14 10.5a4 4 0 0 0-5.7 0l-3 3a4 4 0 0 0 5.7 5.7l1.2-1.2"/></svg>',
    terminal: '<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2.5"/><path d="M7 9l3 3-3 3M13 15h4"/></svg>',
    key: '<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="8" cy="15" r="4"/><path d="M11 12l8-8M17 4l3 3M15 8l2 2"/></svg>',
    user: '<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="3.6"/><path d="M4.5 20a7.5 7.5 0 0 1 15 0"/></svg>',
    sliders: '<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h9M17 7h3M4 12h3M11 12h9M4 17h9M17 17h3"/><circle cx="15" cy="7" r="2"/><circle cx="9" cy="12" r="2"/><circle cx="15" cy="17" r="2"/></svg>',
    activity: '<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12h4l2.5-6 4 12 2.5-6h5"/></svg>',
    info: '<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 8h.01"/></svg>',
    chat: '<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a8 8 0 0 1-8 8H7l-4 3 1.2-4.2A8 8 0 1 1 21 12z"/></svg>',
    rail: '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="3"/><path d="M9 4v16"/></svg>',
    moon: '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M20 14.5A8.5 8.5 0 0 1 9.5 4 8.5 8.5 0 1 0 20 14.5z"/></svg>',
    sun: '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M19.1 4.9l-1.4 1.4M6.3 17.7l-1.4 1.4"/></svg>',
    community: '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="9" r="3"/><circle cx="17" cy="10" r="2.4"/><path d="M3.5 19a5.5 5.5 0 0 1 11 0M14.5 19a4 4 0 0 1 6 0"/></svg>',
    dm: '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a8 8 0 0 1-8 8H7l-4 3 1.2-4.2A8 8 0 1 1 21 12z"/></svg>'
  };
  function paintIcons() {
    document.querySelectorAll('[data-icon]').forEach(function (node) {
      var name = node.getAttribute('data-icon');
      node.innerHTML = ICONS[name] || '';
    });
  }

  function el(tag, attrs, children) {
    var node = document.createElement(tag);
    if (attrs) Object.keys(attrs).forEach(function (k) {
      if (k === 'text') node.textContent = attrs[k];
      else if (k === 'className') node.className = attrs[k];
      else if (k === 'checked') node.checked = !!attrs[k];
      else if (k === 'hidden') node.hidden = !!attrs[k];
      else if (k === 'html') node.innerHTML = attrs[k];
      else node.setAttribute(k, attrs[k]);
    });
    (children || []).forEach(function (child) { if (child) node.appendChild(child); });
    return node;
  }
  function pill(text, kind, withDot) {
    var node = el('span', { className: 'pill ' + (kind || 'neutral') });
    if (withDot !== false) node.appendChild(el('span', { className: 'dot' }));
    node.appendChild(document.createTextNode(text));
    return node;
  }
  function btn(text, kind, onClick, disabled) {
    var b = el('button', { type: 'button', className: 'btn ' + (kind || ''), text: text });
    if (disabled) b.disabled = true;
    b.addEventListener('click', onClick);
    return b;
  }
  function notice(text, kind) {
    var node = document.getElementById('notice');
    node.className = 'notice show ' + (kind === 'info' ? 'info' : '');
    node.textContent = text;
    clearTimeout(notice._t);
    notice._t = setTimeout(function () { node.className = 'notice'; }, 7000);
  }
  function fmtTime(ms) { if (!ms) return ''; return new Date(ms).toLocaleTimeString('zh-CN', { hour12: false }); }
  function relTime(ms) {
    if (!ms) return '—';
    var diff = Date.now() - ms;
    if (diff < 60000) return '刚刚';
    if (diff < 3600000) return Math.floor(diff / 60000) + ' 分钟前';
    if (diff < 86400000) return Math.floor(diff / 3600000) + ' 小时前';
    if (diff < 7 * 86400000) return Math.floor(diff / 86400000) + ' 天前';
    return new Date(ms).toLocaleDateString('zh-CN');
  }
  function api(path, body) {
    return fetch(path, body === undefined ? { cache: 'no-store' } : { method: 'POST', headers: HDR, body: JSON.stringify(body) })
      .then(function (r) { return r.json().then(function (data) { return { status: r.status, data: data }; }); });
  }
  function lineState(line) {
    if (!line || line.status === null || line.status === undefined) return { kind: 'neutral', text: '未启用' };
    if (line.status.connected === true) return { kind: 'ok', text: '已连接' };
    var phase = line.status.phase || 'unknown';
    if (phase === 'reconnecting' || phase === 'connecting' || phase === 'partial') return { kind: 'warn', text: '重连中' };
    return { kind: 'bad', text: '未连接' };
  }

  /* ---------- theme ---------- */
  var THEME_KEY = 'dsh-qq-theme';
  function applyTheme(theme) {
    document.documentElement.setAttribute('data-theme', theme);
    var label = document.getElementById('theme-label');
    if (label) label.textContent = theme === 'dark' ? '浅色主题' : '深色主题';
    var iconNode = document.querySelector('#theme-toggle .ico');
    if (iconNode) iconNode.innerHTML = theme === 'dark' ? ICONS.sun : ICONS.moon;
  }
  function initTheme() {
    var saved = null;
    try { saved = localStorage.getItem(THEME_KEY); } catch (e) { /* 无痕模式 */ }
    var theme = saved || (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
    applyTheme(theme);
    document.getElementById('theme-toggle').addEventListener('click', function () {
      var next = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
      applyTheme(next);
      try { localStorage.setItem(THEME_KEY, next); } catch (e) { /* ignore */ }

  /* ---------- nav scroll spy ---------- */
  function initNav() {
    var items = Array.prototype.slice.call(document.querySelectorAll('.nav-item'));
    var pairs = items.map(function (item) { return { item: item, sec: document.getElementById(item.getAttribute('data-sec')) }; }).filter(function (pair) { return pair.sec !== null; });
    var ticking = false;
    function update() {
      ticking = false;
      var threshold = 150;
      var active = pairs[0];
      pairs.forEach(function (pair) {
        if (pair.sec.getBoundingClientRect().top <= threshold) active = pair;
      });
      pairs.forEach(function (pair) { pair.item.classList.toggle('active', pair.item === active.item); });
    }
    function onScroll() {
      if (ticking) return;
      ticking = true;
      requestAnimationFrame(update);
    }
    window.addEventListener('scroll', onScroll, { passive: true });
    window.addEventListener('resize', onScroll, { passive: true });
    items.forEach(function (item) {
      item.addEventListener('click', function () {
        items.forEach(function (other) { other.classList.toggle('active', other === item); });
      });
    });
    update();
  }

  function currentValue(field) {
    if (Object.prototype.hasOwnProperty.call(dirty, field.path)) return dirty[field.path];
    return S.values[field.path];
  }
  /** 模型目录（后端按 DSH 已配置的 provider/模型给出；缺失时返回 null）。 */
  function modelCatalogOf() {
    return S.models && Array.isArray(S.models.providers) && S.models.providers.length > 0 ? S.models : null;
  }

  /** 生成一个 option 节点。 */
  function optionNode(value, label, selected) {
    var option = el('option', { value: value, text: label });
    if (selected) option.selected = true;
    return option;
  }

  /** provider / model 的动态下拉（目录不可用时退回文本输入）。 */
  function dynamicSelect(field, value) {
    var catalog = modelCatalogOf();
    if (catalog === null) return null;
    var current = String(value === null || value === undefined ? '' : value);
    var selectNode = el('select', {});
    var global = catalog.globalDefault || null;
    var globalText = global ? '（跟随 DSH 全局：' + global.provider + '/' + global.model + '）' : '（留空 / 跟随 DSH 全局）';
    selectNode.appendChild(optionNode('', globalText, current === ''));
    if (field.dynamic === 'provider') {
      catalog.providers.forEach(function (provider) {
        var label = provider.name && provider.name !== provider.id ? provider.name + '（' + provider.id + '）' : provider.id;
        selectNode.appendChild(optionNode(provider.id, label, current === provider.id));
      });
    } else {
      // 模型下拉跟着 provider 走：优先看用户刚改的 provider，其次看目录里的全局默认
      var providerId = String(currentValue({ path: 'agentOptions.provider' }) || '').trim();
      if (providerId === '' && global) providerId = global.provider;
      var provider = catalog.providers.filter(function (entry) { return entry.id === providerId; })[0];
      if (!provider) {
        selectNode.disabled = true;
        selectNode.appendChild(optionNode('', '先选 provider', true));
        return selectNode;
      }
      provider.models.forEach(function (model) {
        var label = model.name && model.name !== model.id ? model.name + '（' + model.id + '）' : model.id;
        selectNode.appendChild(optionNode(model.id, label, current === model.id));
      });
    }
    selectNode.addEventListener('change', function () {
      setDirty(field.path, selectNode.value);
      // provider 改了要刷新模型列表；旧模型不属于新 provider 时清掉，避免保存时被校验拦下
      if (field.dynamic === 'provider') {
        var catalogNow = modelCatalogOf();
        var nextProvider = catalogNow ? catalogNow.providers.filter(function (entry) { return entry.id === selectNode.value; })[0] : null;
        var currentModel = String(dirty['agentOptions.model'] !== undefined ? dirty['agentOptions.model'] : (S.values['agentOptions.model'] || ''));
        if (nextProvider && currentModel !== '' && !nextProvider.models.some(function (model) { return model.id === currentModel; })) {
          setDirty('agentOptions.model', '');
        }
        renderConfig();
      }
    });
    return selectNode;
  }

  function fieldNode(field) {
    var value = currentValue(field);
    if (field.type === 'boolean') {
      var input = el('input', { type: 'checkbox', checked: value === true });
      input.addEventListener('change', function () { setDirty(field.path, input.checked); });
      return el('div', { className: 'field' }, [
        el('div', { className: 'switchrow' }, [el('label', { text: field.label }), el('div', { className: 'switch' }, [input, el('span')])]),
        field.help ? el('div', { className: 'help', text: field.help }) : null
      ]);
    }
    var input2;
    if (field.type === 'select') {
      input2 = el('select', {});
      (field.options || []).forEach(function (option) {
        var opt = el('option', { value: option, text: option === '' ? '（留空 / 继承）' : option });
        if (String(value || '') === option) opt.selected = true;
        input2.appendChild(opt);
      });
    } else if (field.type === 'number') {
      input2 = el('input', { type: 'number', value: value === '' || value === undefined ? '' : String(value) });
    } else if (field.type === 'list') {
      input2 = el('input', { type: 'text', value: Array.isArray(value) ? value.join(', ') : String(value || '') });
    } else {
      input2 = el('input', { type: 'text', value: value === null || value === undefined ? '' : String(value), autocomplete: 'off' });
    }
    input2.addEventListener('input', function () {
      if (field.type === 'list') setDirty(field.path, input2.value.split(',').map(function (s) { return s.trim(); }).filter(Boolean));
      else if (field.type === 'number') setDirty(field.path, input2.value === '' ? '' : Number(input2.value));
      else setDirty(field.path, input2.value);
    });
    return el('div', { className: 'field' }, [
      el('label', { text: field.label }),
      input2,
      field.help ? el('div', { className: 'help', text: field.help }) : null
    ]);
  }
  function setDirty(path, value) { dirty[path] = value; updateSavebar(); }
  function updateSavebar() {
    var count = Object.keys(dirty).length;
    document.getElementById('savebar').hidden = count === 0;
    document.getElementById('dirty-text').textContent = '有 ' + count + ' 处改动未保存；保存后插件会热重载一次。';
    document.getElementById('dirty-note').textContent = count === 0 ? '' : count + ' 处未保存';
  }

  /* ---------- activity ---------- */
  function renderActivity() {
    var host = document.getElementById('activity');
    host.textContent = '';
    var list = (S.connections && S.connections.qqbot) || [];
    document.getElementById('activity-note').textContent = list.length === 0 ? '暂无活动' : list.length + ' 个对话';
    if (list.length === 0) {
      host.appendChild(el('div', { className: 'empty', text: '还没有对话。' }));
      return;
    }
    var rows = el('div', { className: 'rows' });
    list.forEach(function (entry) {
      var target = entry.targetKind === 'group' ? ('群 ' + entry.targetId) : ('私聊 ' + (entry.targetId.length > 10 ? entry.targetId.slice(0, 10) + '…' : entry.targetId));
      rows.appendChild(el('div', { className: 'row' }, [
        el('span', { className: 'ico', html: ICONS[entry.targetKind === 'group' ? 'community' : 'dm'] }),
        el('div', { className: 'grow' }, [
          el('div', { className: 'name', text: target }),
          el('div', { className: 'sub', text: (entry.sessionId ? '会话 ' + entry.sessionId.slice(0, 12) + '…' : '无会话') + ' · ' + entry.sessions + ' 条' })
        ]),
        el('span', { className: 'right', text: relTime(entry.updatedAt) })
      ]));
    });
    host.appendChild(rows);
  }

  /* ---------- runtime ---------- */
  function renderReadonly() {
    var host = document.getElementById('readonly');
    host.textContent = '';
    var rows = [];
    var lines = Array.isArray(S.lines) ? S.lines : [];
    if (lines.length > 0) {
      lines.forEach(function (line) {
        var label = line.kind === 'qqbot' ? '官方线' : line.kind;
        var state = line.connected === true ? '已连接' : '未连接（' + (line.phase || 'unknown') + '）';
        rows.push([label, state + (line.accountId ? ' · ' + line.accountId : '')]);
      });
      lines.filter(function (line) { return line.connected !== true && line.lastError; }).forEach(function (line) {
        rows.push(['官方线错误', String(line.lastError).slice(0, 240)]);
      });
    } else {
      var st = S.status || {};
      rows.push(['传输方式', S.config.transport]);
      rows.push(['连接相位', st.phase || '—']);
    }
    rows.push(['数据目录', S.paths.dataDir]);
    rows.push(['状态文件', S.paths.store || '—']);
    rows.push(['群笔记目录', S.paths.groupNotes]);
    rows.push(['配置文件', S.paths.profilePatch]);
    var grid = el('div', { className: 'kv-grid', style: 'grid-template-columns:repeat(auto-fit,minmax(220px,1fr))' });
    rows.forEach(function (pair) {
      var value = el('div', { className: 'v mono', text: String(pair[1]), title: String(pair[1]) });
      value.style.overflow = 'hidden'; value.style.textOverflow = 'ellipsis'; value.style.whiteSpace = 'nowrap';
      grid.appendChild(el('div', { className: 'kv' }, [el('div', { className: 'k', text: pair[0] }), value]));
    });
    host.appendChild(grid);
    renderAlertEvents(host);
    document.getElementById('raw-config').textContent = JSON.stringify(S.config, null, 2);
  }

  function render() {
    var st = S.status || {};
    var connected = Array.isArray(S.lines) ? S.lines.filter(function (l) { return l.connected === true; }).length : (st.connected === true ? 1 : 0);
    var lineCount = Array.isArray(S.lines) ? S.lines.length : 1;
    var fresh = document.getElementById('fresh');
    var freshText = '更新于 ' + fmtTime(Date.now());
    fresh.className = 'top-fresh ' + (connected === lineCount ? 'ok' : connected > 0 ? 'partial' : 'err');
    if (connected !== lineCount) freshText += ' · ' + connected + '/' + lineCount + ' 在线';
    document.getElementById('fresh-text').textContent = freshText;
    renderTop();
    renderAlerts();
    renderFinding();
    renderBoard();
    renderStats();
    renderTrend();
    renderCredentials();
    renderIdentity();
    renderConfig();
    renderActivity();
    renderReadonly();
  }

  function load() {
    return api('/dsh-qq/api/state').then(function (res) {
      if (!res.data.ok) throw new Error(res.data.error || '读取失败');
      var hadDirty = Object.keys(dirty).length > 0;
      S = res.data.state;
      if (!hadDirty) { render(); return; }
      var st = S.status || {};
      var connected = Array.isArray(S.lines) ? S.lines.filter(function (l) { return l.connected === true; }).length : 0;
      var lineCount = Array.isArray(S.lines) ? S.lines.length : 1;
      var fresh = document.getElementById('fresh');
      fresh.className = 'top-fresh ' + (connected === lineCount ? 'ok' : connected > 0 ? 'partial' : 'err');
      document.getElementById('fresh-text').textContent = '更新于 ' + fmtTime(Date.now());
      renderTop();
      renderAlerts();
      renderFinding();
      renderBoard();
      renderStats();
      renderTrend();
      renderCredentials();
      renderIdentity();
      renderActivity();
      renderReadonly();
    }).catch(function (error) {
      var fresh = document.getElementById('fresh');
      fresh.className = 'top-fresh err';
      document.getElementById('fresh-text').textContent = '读取失败';
      notice('读取状态失败：' + error.message, '');
    });
  }

  function saveConfig(changes) {
    return api('/dsh-qq/api/config', { changes: changes }).then(function (res) {
      if (!res.data.ok) throw new Error(res.data.error || '保存失败');
      dirty = {};
      updateSavebar();
      notice('已保存，插件正在热重载…', 'info');
      setTimeout(load, 1200);
      setTimeout(load, 3500);
    }).catch(function (error) { notice('保存失败：' + error.message, ''); });
  }
  function saveCredentials(payload) {
    return api('/dsh-qq/api/credentials', payload).then(function (res) {
      if (!res.data.ok) throw new Error(res.data.error || '保存失败');
      notice(res.data.message || '已保存', 'info');
      setTimeout(load, 900);
    }).catch(function (error) { notice('保存失败：' + error.message, ''); });
  }
  function doIdentity(payload) {
    return api('/dsh-qq/api/identity', payload).then(function (res) {
      if (!res.data.ok) throw new Error(res.data.error || '操作失败');
      notice(res.data.message || '已完成', 'info');
      load();
    }).catch(function (error) { notice('操作失败：' + error.message, ''); });
  }
  function routeAction(action) {
    return api('/dsh-qq/api/action', { action: action }).then(function (res) {
      if (!res.data.ok) throw new Error(res.data.error || '操作失败');
      notice(res.data.message || '已执行', 'info');
      setTimeout(load, 900);
    }).catch(function (error) { notice('操作失败：' + error.message, ''); });
  }
  function doAction(action) {
    return api('/dsh-qq/api/action', { action: action }).then(function (res) {
      if (!res.data.ok) throw new Error(res.data.error || '操作失败');
      if (res.data.url) {
        var box = document.getElementById('linkbox');
        box.className = 'notice show info';
        box.textContent = '';
        box.appendChild(el('div', { text: '在手机 QQ 里打开下面的链接完成绑定（10 分钟内有效）：' }));
        box.appendChild(el('div', { style: 'margin-top:4px' }, [el('a', { href: res.data.url, target: '_blank', rel: 'noreferrer', text: res.data.url })]));
        notice('已生成绑定链接，扫码完成后会自动连接。', 'info');
      } else {
        notice(res.data.message || '已执行', 'info');
        setTimeout(load, 900);
      }
    }).catch(function (error) { notice('操作失败：' + error.message, ''); });
  }
  paintIcons();
  initTheme();
  initRail();
  initNav();
  document.getElementById('refresh').addEventListener('click', function () { load(); });
  document.getElementById('save').addEventListener('click', function () {
    if (Object.keys(dirty).length === 0) return;
    saveConfig(Object.assign({}, dirty));
  });
  document.getElementById('discard').addEventListener('click', function () {
    dirty = {};
    render();
  });
  load();
  setInterval(function () { if (Object.keys(dirty).length === 0) load(); }, 5000);
})();
</script>
</body>
</html>
