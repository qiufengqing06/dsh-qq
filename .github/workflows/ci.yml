name: CI

# 零依赖项目：不需要 install，直接跑 node --test（Node 22+ 内置测试运行器）。
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# 同一分支连续推送时取消旧运行（省额度，也避免旧结果覆盖新结果）
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node: ['22', '24']
    name: node ${{ matrix.node }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      # 可选依赖（ws / https-proxy-agent / undici）缺席也能全绿：这里刻意不安装任何依赖
      - name: 语法检查（lib + test）
        run: |
          for file in $(git ls-files 'lib/*.js' 'test/**/*.js' 'scripts/*.mjs'); do node --check "$file"; done
      - name: 全量测试
        run: node --test test/*.test.js
      - name: 覆盖率（Node 内置，行覆盖门禁 90%）
        run: node --test --experimental-test-coverage test/*.test.js
      - name: 打包检查（npm pack 只应包含 lib/README/NOTICE/LICENSE/patch）
        run: npm pack --dry-run

  optional-deps:
    # 真实安装可选依赖后再跑一遍：验证 ws / 代理 / undici 的加载路径不是只靠注入假实现
    runs-on: ubuntu-latest
    timeout-minutes: 15
    name: optional deps
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: 安装可选依赖
        run: npm i --no-save --no-package-lock ws https-proxy-agent undici
      - name: 全量测试（带真实可选依赖）
        run: node --test test/*.test.js
